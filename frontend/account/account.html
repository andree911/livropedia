<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

    <title>Minha conta - Controle de livros</title>
</head>
<body>
    <div id="sidebar-container"></div>
    
    <header>
        <button id="logout-button" onclick="logout()">Sair</button>
        <button class="menu-button" onclick="toggleNav()">☰</button>
    </header>
    <div class="account">
        <h1>Minha conta</h1>
        <div class="label"><label>Nome</label></div>
        
        <input id="name" placeholder="nome">
        <div>
        <button class="solid-button" id="add-name-button" onclick="saveName()">Adicionar nome</button>
        </div>
        <button class="solid-button" id="delete-account-button" onclick="showConfirm()">Excluir minha conta</button>
    <div id="confirm-delete-account" style="display: none;">
        <div class="label"><label>Senha</label></div>
        <div class="inputs">
        <input type="password" id="delete-confirm-password" placeholder="Digite sua senha para excluir sua conta">
        </div>
        <div>
        <button class="solid-button" id="delete-account-button-confirm">Excluir minha conta permanentemente</button>
        </div>
    </div>
    </div>
</body>

<link rel="stylesheet" href="/index.css" />
<link rel="stylesheet" href="account.css" />
<link rel="stylesheet" href="/sidebar/sidebar.css" />

<script src="account.js"></script>
<script src="/sidebar/sidebar.js"></script>
</html>
