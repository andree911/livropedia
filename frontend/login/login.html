<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

    <title>Login - Controle de livros</title>
</head>
<body>

<h1>Login</h1>
<div class="inputs-login">
    <div class="label"><label>Email</label></div>
        <input type="email" id="email" onchange="onChangeEmail()" placeholder="Email">
        <div class="error" id="email-required-error">Email é obrigatório</div>
        <div class="error" id="email-invalid-error">Email é inválido</div>
    <div class="label"><label>Senha</label></div>
        <div class="inputs">
        <input type="password" id="password" onchange="onChangePassword()" placeholder="Senha">
        </div>
        <div class="error" id="password-required-error">Senha é obrigatório</div>
        <div class="error" id="password-invalid-error">Senha deve ter pelo menos 6 caracteres</div>
</div>
<div>
    <button type="button" class="solid-button" id="register-button" onclick="goToRegister()">Não tenho uma conta</button>
</div>
<div>
    <button type="button" class="solid-button" id="recover-password-button" onclick="recoverPassword()" disabled="true" >Recuperar senha</button>
</div>
<div>
    <button type="button" class="solid-button" id="login-button" disabled="true" onclick="login()">Entrar</button>
</div>
</body>

<link rel="stylesheet" href="/index.css" />
<link rel="stylesheet" href="/login/login.css" />

<script src="/login/login.js"></script>

</html>
