<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

    <title>Recuperar Senha - Controle de livros</title>
</head>
<body>

<h1>Recuperar Senha</h1>
    <div class="recover">
        <div class="label"><label>Senha</label></div>
        <div class="inputs">
        <input type="password" id="new-password" onchange="onChangeNewPassword()" placeholder="Nova senha">
        </div>
        <div class="error" id="password-required-error">Senha é obrigatório</div>
        <div class="error" id="password-invalid-error">Senha deve ter pelo menos 6 caracteres</div>
        <div class="label"><label>Confirmar senha</label></div>
        <div class="inputs">
        <input type="password" id="confirm-new-password" onchange="onChangeNewPassword()" placeholder="Confirmar senha">
        </div>
        <div class="error" id="password-doesnt-equals">Senhas não são iguais</div>
    </div>
    <div>
        <button class="solid-button" id="reset-password-button" disabled onclick="resetarSenha()">Alterar minha senha</button>
    </div>
</body>

<link rel="stylesheet" href="/index.css" />
<link rel="stylesheet" href="recover.css" />

<script src="recover.js"></script>
</html>
