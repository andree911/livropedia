<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <title>Home - Controle de livros</title>
</head>
<body>
    <div id="sidebar-container"></div>
    
    <header>
        <button id="logout-button" onclick="logout()">Sair</button>
        <button class="menu-button" onclick="toggleNav()">☰</button>
    </header>
<div class="container" id="container">
<div id="livro-sidebar" class="livro-sidebar">
    <button class="menu-button" id="close-button" onclick="closeLivro()">✕</button>
<div class="livro-content">
    <div class="capa-container">
    <img id="sidebar-capa" class="livro-capa" src="" alt=""/>
    <p class="placeholder-capa">Sem capa adicionada</p>
    </div>
<div class="capa-actions">
    <button for="input-capa-file" id="escolher-capa">Escolher capa</button>
    <input type="file" id="input-capa-file" accept="image/*" style="display: none;" hidden/>
    <button id="btn-upload-capa">Salvar capa</button>
</div>
    <h2 id="sidebar-titulo"></h2>
    <p id="sidebar-autor"></p>
    <p id="sidebar-id"></p>
    <label class="label">Resumo:</label>
    <textarea id="sidebar-resumo" rows="5" placeholder="Adicione um resumo..."></textarea>
    <button  id="btn-salvar-resumo">Salvar resumo</button>
</div>
</div>
<div id="livro-overlay"></div>
        
<div class="searchs">
    <h1>Busca de livros</h1>
    
    <button class="solid-button" onclick="buscarLivros()">Carregar Livros</button>
    <button class="solid-button" onclick="limparBusca()">Limpar</button>
<div>
    <ul id="lista"></ul>
</div>

    <div class="searchs">
        <h1>Busca por id</h1>
        <div class="inputs">
        <input id="LivroId" type="number" placeholder="id">
        </div>
    <div>
        <ul id="lista-id"></ul>
    </div>
    </div>
    
    <div class="searchs">
        <h1>Busca por titulo</h1>
        <div class="inputs">
        <input id="LivroTitulo" type="text" placeholder="Título">
        </div>
    <div>
        <ul id="lista-titulo"></ul>
    </div>
    </div>
</div>
</div>
</div>


</body>

<link rel="stylesheet" href="/index.css" />
<link rel="stylesheet" href="/sidebar/sidebar.css" />

<script src="index.js"></script>
<script src="/sidebar/sidebar.js"></script>


</html>
